<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apps by Arseniiiii-ai</title>
    <style>
      :root {
        --bg: #edf0f5;
        --ink: #111a2e;
        --muted: #5a6479;
        --accent: #2b4bff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c111d;
          --ink: #e8ecf4;
          --muted: #97a1b5;
          --accent: #7d93ff;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px max(16px, env(safe-area-inset-left, 0px));
      }
      h1 {
        font-size: 28px;
        margin: 0 0 16px;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
      p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <p><a href="one-percent-better/">1% Better</a>, a free daily habit tracker for iPhone and Android.</p>
    </main>
  </body>
</html>
